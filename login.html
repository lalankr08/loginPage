<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shaastra 2026 · Log in</title>
<style>
:root{
  --bg:#1f0b14;
  --bg2:#3a1424;
  --ink:#fff1f4;
  --mute:#c9a3ae;
  --line:rgba(255,200,215,.2);
  --rose:#ff5c85;
  --deep:#d6336c;
  --blush:#ffc2d1;
  --bub:#341624;
  --serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);overflow-x:hidden;
  background:radial-gradient(60% 50% at 75% 5%,#5a1f38 0%,transparent 70%),
  radial-gradient(55% 45% at 10% 95%,#44162f 0%,transparent 70%),var(--bg)}

header{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px clamp(18px,6vw,100px)}
.brand{font-family:var(--serif);font-size:clamp(28px,4vw,40px);display:flex;align-items:center;gap:12px}
.brand i{font-style:normal;color:var(--blush);text-shadow:0 0 16px var(--rose)}
nav{display:flex;gap:6px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.05);backdrop-filter:blur(10px)}
nav a{color:var(--mute);text-decoration:none;font-size:14px;padding:8px 16px;position:relative;border-radius:999px;transition:color .2s}
nav a:hover,nav a:focus-visible{color:var(--ink);outline:none}
nav a:focus-visible{box-shadow:0 0 0 2px var(--rose)}
nav a.on{color:var(--ink)}
nav a.on::after{content:"";position:absolute;left:16px;right:16px;bottom:2px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--rose),transparent)}

.rain{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.rain span{position:absolute;top:0;left:var(--x);white-space:nowrap;padding:9px 16px;border-radius:18px 18px 18px 4px;
  background:var(--bub);color:#e4c3cc;font-size:14px;border:1px solid rgba(255,200,215,.1);
  opacity:0;transform:translateY(-20vh) rotate(var(--r));animation:fall var(--t) linear var(--d) infinite}
.rain span.me{background:linear-gradient(135deg,var(--rose),var(--deep));color:#fff;border:0;border-radius:18px 18px 4px 18px}
.rain span.big{font-family:var(--serif);font-size:30px;background:none;border:0;padding:0;color:rgba(255,194,209,.5)}
@keyframes fall{
  0%{opacity:0;transform:translateY(-20vh) rotate(var(--r))}
  10%{opacity:.85}
  85%{opacity:.7}
  100%{opacity:0;transform:translateY(110vh) rotate(calc(var(--r) * -2.5))}
}

main{position:relative;z-index:3;display:grid;place-items:center;padding:90px 18px 60px;min-height:calc(100vh - 110px)}
.card{width:min(100%,420px);padding:34px 32px 28px;border-radius:28px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(255,150,180,.14),rgba(255,255,255,.03));backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(20,0,10,.6),0 0 0 1px rgba(255,92,133,.08) inset}

.heart{width:88px;height:80px;margin:-76px auto 10px;position:relative;filter:drop-shadow(0 10px 22px rgba(255,92,133,.6));animation:beat 2.4s ease-in-out infinite}
.heart svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.heart .l{clip-path:polygon(0 0,52% 0,44% 22%,56% 42%,46% 62%,54% 100%,0 100%);animation:lft 3.6s ease-in-out infinite}
.heart .r{clip-path:polygon(52% 0,100% 0,100% 100%,54% 100%,46% 62%,56% 42%,44% 22%);animation:rgt 3.6s ease-in-out infinite}
.heart.bk .l{animation:none;transform:translate(-22px,10px) rotate(-18deg)}
.heart.bk .r{animation:none;transform:translate(22px,14px) rotate(20deg)}
@keyframes beat{0%,100%{scale:1}8%{scale:1.06}16%{scale:1}24%{scale:1.04}32%{scale:1}}
@keyframes lft{0%,100%{transform:translate(0) rotate(0)}50%{transform:translate(-7px,3px) rotate(-7deg)}}
@keyframes rgt{0%,100%{transform:translate(0) rotate(0)}50%{transform:translate(7px,5px) rotate(8deg)}}

h1{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.05;margin:0 0 6px;text-align:center}
.sub{margin:0 0 24px;text-align:center;color:var(--mute);font-size:14px}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 6px 4px}
input{width:100%;padding:14px 18px;margin-bottom:16px;border-radius:999px;border:1px solid var(--line);background:rgba(25,5,14,.6);color:var(--ink);font:inherit;font-size:15px;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#8a6572}
input:focus-visible{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(255,92,133,.28)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:-2px 4px 20px;gap:10px}
.row a{color:var(--blush);text-decoration:none}
.row a:hover{text-decoration:underline}
button{width:100%;padding:15px;border:0;border-radius:999px;font:600 15px var(--sans);color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--rose),var(--deep));box-shadow:0 10px 28px rgba(214,51,108,.45);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(255,92,133,.55)}
button:focus-visible{outline:2px solid var(--blush);outline-offset:3px}
.alt{display:flex;align-items:center;gap:12px;margin:20px 0 14px;color:#8a6572;font-size:12px}
.alt::before,.alt::after{content:"";flex:1;height:1px;background:var(--line)}
.ghost{background:transparent;border:1px dashed var(--line);box-shadow:none;color:var(--mute);font-weight:500;font-size:14px}
.ghost:hover{box-shadow:none;color:var(--ink);border-color:var(--rose)}
.seen{margin:18px 0 0;text-align:center;font-size:12px;color:#8a6572;min-height:1.4em}

.typing{position:absolute;right:max(18px,calc(50% - 330px));bottom:36px;display:flex;gap:5px;align-items:center;padding:12px 16px;border-radius:18px 18px 18px 4px;background:var(--bub);border:1px solid var(--line)}
.typing b{width:7px;height:7px;border-radius:50%;background:var(--blush);animation:dot 1.2s infinite}
.typing b:nth-child(2){animation-delay:.2s}.typing b:nth-child(3){animation-delay:.4s}
.typing small{margin-left:8px;color:var(--mute);font-size:12px}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

@media(max-width:760px){.typing{display:none}header{justify-content:center}nav a{padding:8px 10px;font-size:13px}.rain span:nth-child(n+9){display:none}}
@media(prefers-reduced-motion:reduce){
  .rain span{animation:none;opacity:.5;transform:translateY(var(--y,30vh)) rotate(var(--r))}
  .heart,.heart .l,.heart .r,.typing b{animation:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">Shaastra 2026 <i>&#10022;</i></div>
  <nav aria-label="Main">
    <a class="on" href="#">Home</a><a href="#">Events</a><a href="#">Workshops</a><a href="#">Contact</a>
  </nav>
</header>

<div class="rain" id="rain" aria-hidden="true"></div>

<main>
  <section class="card" aria-labelledby="t">
    <div class="heart" id="h" aria-hidden="true">
      <svg class="l" viewBox="0 0 100 90"><use href="#hp" fill="url(#g1)"/></svg>
      <svg class="r" viewBox="0 0 100 90"><use href="#hp" fill="url(#g2)"/></svg>
    </div>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <path id="hp" d="M50 86C14 58 4 40 4 26 4 12 14 4 27 4c10 0 19 6 23 14 4-8 13-14 23-14 13 0 23 8 23 22 0 14-10 32-46 60z"/>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fab"/><stop offset="1" stop-color="#e0336b"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6f98"/><stop offset="1" stop-color="#c2255c"/></linearGradient>
      </defs>
    </svg>
    <h1 id="t">Welcome back.<br>Why, though?</h1>
    <p class="sub">Log in to read the messages you swore you'd delete.</p>

    <form id="f" novalidate>
      <label for="e">Email</label>
      <input id="e" type="email" autocomplete="email" placeholder="the one they still know by heart">
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" placeholder="not their birthday. again.">
      <div class="row"><span>Remember me (unlike them)</span><a href="#">Forgot password?</a></div>
      <button type="submit">Log in &amp; regret it</button>
    </form>
    <div class="alt">or</div>
    <button type="button" class="ghost" id="n">Continue with my ex's Netflix</button>
    <p class="seen" id="s" role="status">No account? Seen 11:47 PM &middot; Delivered, not replied</p>
  </section>

  <div class="typing" aria-hidden="true"><b></b><b></b><b></b><small>Ex is typing...</small></div>
</main>

<script>
const T=[
  ["we need to talk"],["hey, you up?","me"],["k.","big"],["it's not you, it's me"],
  ["new phone who dis","me"],["Seen 11:42 PM"],["\"let's stay friends\"","big"],["typing...","me"],
  ["you're blocked"],["I need space"],["I'm fine :)","me"],["liked your story"],
  ["Ex: 1 / Me: 0","big"],["unfollowed you"]
];
const r=document.getElementById("rain");
T.forEach(([x,c],i)=>{
  const s=document.createElement("span");
  if(c)s.className=c;
  s.textContent=x;
  const v={x:(i*7.3+4)%92+"%",t:12+(i*1.7)%10+"s",d:-(i*2.3)%18+"s",r:(i%2?1:-1)*(4+i%4)+"deg",y:(i*13+10)%80+"vh"};
  for(const k in v)s.style.setProperty("--"+k,v[k]);
  r.appendChild(s);
});

const h=document.getElementById("h"),s=document.getElementById("s"),f=document.getElementById("f");
const say=m=>{s.textContent=m};
f.addEventListener("submit",e=>{
  e.preventDefault();
  const m=f.e.value.trim();
  if(!/^\S+@\S+\.\S+$/.test(m)){say("That email doesn't look right. Check it and try again.");f.e.focus();return}
  if(!f.p.value){say("Enter your password.");f.p.focus();return}
  h.classList.add("bk");
  say("Logged in. Delivered, not replied.");
});
document.getElementById("n").addEventListener("click",()=>{
  h.classList.toggle("bk");
  say("Their password changed. Of course it did.");
});
</script>
</body>
</html>
